<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversor de temperatura</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Conversor de temperatura</h1>

    <label for="modo">Conversión</label>
    <select id="modo">
      <option value="cf">De Celsius a Fahrenheit</option>
      <option value="fc">De Fahrenheit a Celsius</option>
    </select>

    <label for="grados">Grados a convertir</label>
    <input type="number" id="grados" step="any" placeholder="Ej: 100">

    <button id="convertir">Convertir</button>

    <p id="resultado"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
